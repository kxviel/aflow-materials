  # ────────────────────────────────────────────────────────────────────────────
  # Phase-1 extractor output (normalize_structure_phase1_mp_compatible.py)
  # Use this when feeding Phase-1 CSV directly into this script
  # ────────────────────────────────────────────────────────────────────────────
  phase1:
    material_id:      "structure_uid"
    spacegroup:       "spacegroup_number_reported"
    crystal_system:   "crystal_system_reported"
    bravais_lattice:  null
    point_group:      "point_group_reported"
