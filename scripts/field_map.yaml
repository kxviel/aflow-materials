  # Copy this block and rename it for a new database.
  # Set any unknown field to null — it will be skipped gracefully.
  # Fields left out entirely fall back to fuzzy auto-detection.
  # ────────────────────────────────────────────────────────────────────────────
  my_new_database:
    material_id:      "id"
    spacegroup:       null
    crystal_system:   null
    bravais_lattice:  null
    point_group:      null
    formula:          null
    composition:      null
