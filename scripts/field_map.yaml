  # ────────────────────────────────────────────────────────────────────────────
  alexandria:
    material_id:      "id"
    spacegroup:       "spacegroup_number"
    crystal_system:   null
    bravais_lattice:  null
    point_group:      null
    formula:          "formula"
    composition:      null
    dimensionality:   null
    material_form:    null
    layer_group:      null
    wyckoff:          null
    lattice_a:        "a"
    lattice_b:        "b"
    lattice_c:        "c"
    lattice_alpha:    "alpha"
    lattice_beta:     "beta"
    lattice_gamma:    "gamma"
    lattice_volume:   "volume"
    pbc:              null
    lattice_matrix:   null
    nsites:           "nsites"
