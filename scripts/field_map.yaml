    lattice_beta:     null
    lattice_gamma:    null
    lattice_volume:   null
    pbc:              null
    lattice_matrix:   null
    nsites:           null
    site_species:     null


# ══════════════════════════════════════════════════════════════════════════════
# SPACE GROUP NOTATION REFERENCE
# ══════════════════════════════════════════════════════════════════════════════
#
# The script auto-detects any of these notations from the spacegroup field:
#
#   ita_number    Pure integer 1–230            e.g.  227
#   hm_short      Hermann-Mauguin short         e.g.  Fd-3m  |  F d -3 m  |  Fd3m
#   hm_full       HM with origin/setting choice e.g.  Fd-3m:2  |  R-3m:R
#   hall          Hall symbol                   e.g.  -F 4vw 2vw 3
#   schoenflies   Schoenflies + superscript      e.g.  Oh^10  |  D2h^28
#   verbal        Crystal system text            e.g.  cubic  |  monoclinic P
#
# All are resolved to an ITA integer in normalized_spacegroup_ita.
# If resolution fails: normalized_spacegroup_ita = '' and a warning is written.
#
# ══════════════════════════════════════════════════════════════════════════════
