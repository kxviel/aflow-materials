    material_id:      "uid"
    spacegroup:       "spacegroup"
    crystal_system:   null
    bravais_lattice:  null
    point_group:      "pointgroup"
    formula:          "formula"
    composition:      null
    dimensionality:   "dimensionality"
    material_form:    null
    layer_group:      "layergroup_number"
    wyckoff:          null
    lattice_a:        "a"
    lattice_b:        "b"
    lattice_c:        "c"
    lattice_alpha:    "alpha"
    lattice_beta:     "beta"
    lattice_gamma:    "gamma"
    lattice_volume:   null
