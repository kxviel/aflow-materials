[project]
name = "aflow"
version = "0.1.0"
description = "Resumable AFLOW downloads and per-entry material normalization"
readme = "README.md"
authors = [{ name = "kxviel", email = "kevin.dgoveas@gmail.com" }]
requires-python = ">=3.11.16"
dependencies = [
    "ijson>=3.5.1",
    "pandas>=3.0.6",
    "pymatgen>=2026.9.24",
    "pyyaml>=6.0.3",
    "spglib>=2.7.0",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
